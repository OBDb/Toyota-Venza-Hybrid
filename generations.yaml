generations:
  - name: "First Generation (AV10)"
    start_year: 2009
    end_year: 2015
    description: "The first-generation Venza was introduced for the 2009 model year as a mid-size crossover SUV based on the XV40 series Camry platform (K platform). While primarily available with conventional gasoline engines (2.7L 1AR-FE I4 producing 182 hp and 3.5L 2GR-FE V6 producing 268 hp), Toyota offered a hybrid variant in select markets. The Venza was marketed as blending sedan comfort with SUV utility, featuring a car-like ride and handling. Available in front-wheel drive or all-wheel drive configurations with a 6-speed automatic transmission. The interior featured standard amenities including power-adjustable front seats, dual-zone climate control, and an 8-inch touchscreen infotainment system on later models. A mid-cycle facelift was introduced for the 2013 model year with updated styling and the addition of Toyota Entune infotainment. Production ended in June 2015 for US models, with export continuing until 2017."

  - name: "Second Generation (XU80)"
    start_year: 2021
    end_year: 2024
    description: "The second-generation Venza is a rebadged Japanese-market XU80 series Harrier, reintroduced exclusively as a hybrid vehicle for the 2021 model year. Built on Toyota's TNGA-GA-K platform, it features a sophisticated hybrid powertrain combining a 2.5-liter A25A-FKS Atkinson-cycle four-cylinder engine with three electric motors (one starter/generator and two drive motors), producing a combined system output of 219 horsepower. Unlike its predecessor, the second generation is available exclusively with electronic on-demand all-wheel drive, which uses a dedicated rear electric motor for improved efficiency and traction. The Venza Hybrid delivers an EPA-rated 40 mpg combined fuel economy. Production moved from the US (Toyota Motor Manufacturing Kentucky) to Japan. Standard features include Toyota Safety Sense 2.0, an 8-inch touchscreen infotainment system (12.3-inch available), and premium interior materials. The Limited trim offered innovative features including the Star Gaze electrochromic glass roof that switches between transparent and frosted modes. The Venza was discontinued in North America at the end of the 2024 model year, replaced by the Toyota Crown Signia."